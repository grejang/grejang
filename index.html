<!DOCTYPE html>

<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREJANG</title>
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
    <link rel="icon" href="favicon.ico">
    <style>
      body {
        background-image: url("backgrounds/skybase.png"); 
        background-size: cover;
        background-position: center; 
        background-attachment: fixed; 
        color: white;
        font-family: "VoidFont", monospace;
      }
      .text {
        background: rgba(20,20,20,0.8);
        border: 2px solid #626161;
        border-radius: 6px;
        padding: 5px 10px;
        width: 700px;
        margin-bottom: 10px;
      }
      
    </style>
  </head>
  <body>
  
  <div class="text">
  
	<script>
		const isMobile = window.innerWidth <= 768;
		document.head.insertAdjacentHTML('beforeend', `<style> ${isMobile ? ` .text { width: 330px; } .notification { width: 310px; } #logo { width: 320px; } ` : `.text {  } `}</style>`);
	</script>
     
    <img id="logo" src="images/grejanglogofullname.png" alt="Grejang Logo Full">
	
	<h1>GREJANG</h1>
	
	<p>A beginning to an end</p>

    <p>- Il team di Grejang</p>
	
  </div>
  </body>
</html>
